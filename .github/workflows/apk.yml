# Compila el APK de EcoAlaya y lo publica en Releases con un enlace de descarga directa.
name: APK Android

on:
  push:
    branches: [main, claude/ecoalaya-token-hydroponics-vbje8v]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Copiar la app web al proyecto Android
        run: npm run android:sync

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../EcoAlaya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EcoAlaya-apk
          path: EcoAlaya.apk

      - name: Publicar en Releases (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest EcoAlaya.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EcoAlaya APK (versión 1.0.${{ github.run_number }})" \
            --notes "APK de prueba generado desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Descárgalo en tu celular Android y permite instalar apps de fuentes desconocidas."
